<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sales Brief">
<title>Sales Brief</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>Sales Brief</h1>
      <p id="subtitle">Your next best action</p>
    </div>
    <button id="who" class="who" hidden aria-label="Switch salesperson"></button>
  </header>

  <main id="view-brief" class="view">
    <div id="chat" class="chat" aria-live="polite"></div>
    <div id="dock" class="dock" hidden>
      <button data-act="brief">Today's visits</button>
      <button data-act="close">Likely to close</button>
      <button data-act="churn">May churn</button>
      <button data-act="customers">My customers</button>
      <button data-act="upload">Upload files</button>
      <button data-act="more">More</button>
    </div>
  </main>

  <main id="view-dash" class="view dash" hidden></main>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-brief" aria-selected="true" data-tab="brief">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      My brief
    </button>
    <button role="tab" id="tab-dash" aria-selected="false" data-tab="dash">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Revenue dashboard
    </button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="x" data-close aria-label="Close">Close</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
    <div id="sheet-foot" class="sheet-foot"></div>
  </div>
</div>

<input id="file" type="file" hidden multiple accept=".xlsx,.xls,.xlsm,.csv,.docx,.pptx,.doc,.ppt">
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/parsers.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
