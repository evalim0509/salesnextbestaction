<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe5f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nudge">
<title>Nudge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ring" id="home" aria-label="Home"><span class="orb sm"></span></button>
    <h1>Nudge</h1>
    <div class="who-wrap">
      <button id="who" class="who" aria-haspopup="listbox" aria-expanded="false" hidden><span id="who-name"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="who-menu" class="who-menu" role="listbox" hidden></div>
    </div>
    <button class="round" data-act="more" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <main id="view-brief" class="view">
    <div id="chat" class="chat" aria-live="polite"></div>
    <div id="dock" class="dock" hidden>
      <div class="dock-row">
        <button class="round" data-act="upload" aria-label="Upload files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5m0 0l-4 4m4-4l4 4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="say" data-act="note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Record a visit note
        </button>
        <button class="round dark" data-act="customers" aria-label="My customers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm-6 9c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 6.5M17.5 14.3c2.1.8 3.5 2.9 3.5 5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="suggest">
        <button data-act="brief">Today's brief</button>
        <button data-act="gap">Close my gap</button>
        <button data-act="close">Likely to close</button>
        <button data-act="churn">May churn</button>
        <button data-act="wrap">Wrap up my day</button>
        <button data-act="customers">My customers</button>
        <button data-act="export">Export</button>
      </div>
    </div>
  </main>

  <main id="view-dash" class="view dash" hidden></main>

</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="x" data-close aria-label="Close">Close</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
    <div id="sheet-foot" class="sheet-foot"></div>
  </div>
</div>

<input id="file" type="file" hidden multiple accept=".xlsx,.xls,.xlsm,.csv,.docx,.pptx,.doc,.ppt">
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/parsers.js"></script>
<script src="vendor/pptxgen.min.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
